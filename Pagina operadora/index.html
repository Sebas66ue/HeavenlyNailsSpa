<!-- SECCIÓN DE RESERVA / AGENDA (REEMPLAZA TU FORM ACTUAL) -->
<!-- ========================================================= -->
<section class="booking" id="agenda">
  <div class="container booking-grid">
    <div class="booking-copy">
      <p class="eyebrow">Agenda tu cita</p>
      <h2>Reserva tu momento de belleza</h2>
      <p>
        Escoge tu servicio favorito, selecciona un horario y nuestro equipo te atenderá
        con la mejor experiencia en Nails SPA.
      </p>

      <div class="info-boxes">
        <div>
          <strong>Horario</strong>
          <span>Lun - Sab | 10:00 - 20:00</span>
        </div>
        <div>
          <strong>Ubicación</strong>
          <span>Centro, Ciudad de México</span>
        </div>
      </div>
    </div>

    <form class="booking-form" id="bookingForm">
      <div class="field-row">
        <label>
          Nombre completo
          <input type="text" id="clientName" name="name" placeholder="Tu nombre" required />
        </label>

        <label>
          Teléfono
          <input type="tel" id="clientPhone" name="phone" placeholder="555 123 4567" required />
        </label>
      </div>

      <div class="field-row">
        <label>
          Email
          <input type="email" id="clientEmail" name="email" placeholder="tuemail@correo.com" required />
        </label>

        <label>
          Servicio
          <select id="serviceSelect" name="service" required>
            <option value="">Selecciona una opción</option>
            <option value="Polygel">Polygel</option>
            <option value="Acrílicas">Acrílicas</option>
            <option value="Press on">Press on</option>
            <option value="Retoques">Retoques</option>
            <option value="Baño en Polygel en uña natural">Baño en Polygel en uña natural</option>
            <option value="Manos semipermanente">Manos semipermanente</option>
            <option value="Pies semipermanente">Pies semipermanente</option>
            <option value="Semipermanente caballero">Semipermanente caballero</option>
          </select>
        </label>
      </div>

      <div class="calendar-panel">
        <div class="calendar-header">
          <button type="button" class="calendar-nav" aria-label="Mes anterior">‹</button>
          <h3 id="calendarMonthLabel">Mes</h3>
          <button type="button" class="calendar-nav" aria-label="Mes siguiente">›</button>
        </div>

        <div class="calendar-weekdays">
          <span>Dom</span>
          <span>Lun</span>
          <span>Mar</span>
          <span>Mié</span>
          <span>Jue</span>
          <span>Vie</span>
          <span>Sáb</span>
        </div>

        <div id="calendar" class="calendar-days"></div>
      </div>

      <div class="slot-picker">
        <label>Hora disponible</label>
        <div id="slotList" class="slot-options" aria-live="polite"></div>
      </div>

      <input type="hidden" id="selectedSlot" />

      <label>
        Detalles adicionales
        <textarea id="clientNotes" name="notes" rows="4" placeholder="Cuéntanos qué estilo te gustaría..."></textarea>
      </label>

      <button type="submit" class="primary-btn submit-btn">Confirmar cita</button>
    </form>
  </div>
</section>
